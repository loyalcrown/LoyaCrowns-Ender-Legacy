name: Build 0.5.4 Inventory Panel Crafting

on:
  workflow_dispatch:
  push:
    branches: [ "dev/final-parity-0.5.0" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download validated 0.5.3 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact
          gh run download 36258798183 \
            --repo "$GITHUB_REPOSITORY" \
            --name LoyalCrowns-Ender-Legacy-1.20.1-0.5.3-dev-source \
            --dir /tmp/source-artifact
          SOURCE_ZIP="$(find /tmp/source-artifact -type f -name '*0.5.3-dev-source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP"
          PROJECT_DIR="$(find . -maxdepth 2 -type f -name gradle.properties -path '*0.5.3-worktree*' -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          grep -q '^mod_version=0.5.3-alpha$' "$PROJECT_DIR/gradle.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply 0.5.4 Inventory Panel crafting and return pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('patches/0.5.4/inventory_crafting_return.patch.zlib.b64').read_text().strip()
          Path('/tmp/inventory_crafting_return.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          patch -d "$PROJECT_DIR" -p1 < /tmp/inventory_crafting_return.patch
          grep -q '^mod_version=0.5.4-alpha$' "$PROJECT_DIR/gradle.properties"
          grep -q 'TransientCraftingContainer' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/InventoryPanelMenu.java"
          grep -q 'RETURN_SLOTS = 5' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/InventoryPanelMenu.java"

      - name: Prepare Forge build
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])/'build.gradle'
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line)+'\n')
          PY

      - name: Validate resources
        shell: bash
        run: |
          python "$PROJECT_DIR/tools/validate_assets.py"
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])/'src/main/resources'
          count=0
          for p in root.rglob('*'):
              if p.suffix in {'.json','.mcmeta'}:
                  json.loads(p.read_text())
                  count += 1
          print(f'Validated {count} JSON/mcmeta resources.')
          PY

      - name: Build and reobfuscate
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Validate 0.5.4 JAR
        shell: bash
        run: |
          JAR="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name 'LoyalCrowns-Ender-Legacy-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/menu/InventoryPanelMenu.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/client/InventoryPanelScreen.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/util/NetworkInventoryContainer.class' /tmp/jar-contents.txt
          grep -q 'assets/loyacrowns_ender_legacy/textures/gui/inv_panel.png' /tmp/jar-contents.txt
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="0.5.4-alpha"'
          echo '0.5.4 Inventory Panel crafting/return pass validated.'

      - uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.5.4-alpha
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
