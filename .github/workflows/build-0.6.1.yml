name: Build 0.6.1 SkyFactory Parity UI Pass

on:
  workflow_dispatch:
  push:
    branches: [ "dev/final-parity-0.5.0" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download validated 0.6.0 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact
          gh run download 36278525796 \
            --repo "$GITHUB_REPOSITORY" \
            --name LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-dev-source \
            --dir /tmp/source-artifact
          SOURCE_ZIP="$(find /tmp/source-artifact -type f -name '*0.6.0-dev-source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP"
          PROJECT_DIR="$(find . -maxdepth 3 -type f -name gradle.properties -path '*0.6.0-worktree*' -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          grep -q '^mod_version=0.6.0-alpha$' "$PROJECT_DIR/gradle.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply 0.6.1 parity and modern UI patch
        shell: bash
        run: |
          python patches/0.6.1/apply_parity_patch.py "$PROJECT_DIR"
          grep -q '^mod_version=0.6.1-alpha$' "$PROJECT_DIR/gradle.properties"
          grep -q 'toggleSupplySlotLock' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
          grep -q 'toggleShowingRange' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
          grep -q 'FIRST_SUPPLY_LOCK_BUTTON_ID' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/FarmingStationMenu.java"
          grep -q 'ioConfigOpen' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/FarmingStationScreen.java"
          grep -q '0xA8101010' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/FarmingStationScreen.java"
          grep -q '0xA8101010' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/DimensionalTransceiverScreen.java"
          grep -q '0xA8101010' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/InventoryPanelScreen.java"
          test -f "$PROJECT_DIR/PARITY_RULES.md"

      - name: Prepare Forge build
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])/'build.gradle'
          p.write_text('\n'.join(line for line in p.read_text().splitlines()
              if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line)+'\n')
          PY

      - name: Validate resources
        shell: bash
        run: |
          python "$PROJECT_DIR/tools/validate_assets.py"
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])/'src/main/resources'
          total=0
          for p in root.rglob('*'):
              if p.suffix in {'.json','.mcmeta'}:
                  json.loads(p.read_text())
                  total += 1
          print(f'Validated {total} JSON/mcmeta resources.')
          PY

      - name: Build and reobfuscate
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Validate 0.6.1 JAR
        shell: bash
        run: |
          JAR="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name 'LoyalCrowns-Ender-Legacy-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/menu/FarmingStationMenu.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/client/FarmingStationScreen.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/client/DimensionalTransceiverScreen.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/client/InventoryPanelScreen.class' /tmp/jar-contents.txt
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="0.6.1-alpha"'
          cp "$JAR" "$GITHUB_WORKSPACE/LoyalCrowns-Ender-Legacy-1.20.1-0.6.1-alpha.jar"

      - name: Package validated source snapshot
        shell: bash
        run: |
          PARENT="$(dirname "$PROJECT_DIR")"
          NAME="$(basename "$PROJECT_DIR")"
          (cd "$PARENT" && zip -qr "$GITHUB_WORKSPACE/LoyalCrowns-Ender-Legacy-1.20.1-0.6.1-dev-source.zip" "$NAME" -x "$NAME/build/*" "$NAME/.gradle/*")

      - uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.6.1-alpha
          path: LoyalCrowns-Ender-Legacy-1.20.1-0.6.1-alpha.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.6.1-dev-source
          path: LoyalCrowns-Ender-Legacy-1.20.1-0.6.1-dev-source.zip
          if-no-files-found: error
