name: Build 0.6.0 Modern Machine Foundation

on:
  workflow_dispatch:
  push:
    branches: [ "dev/final-parity-0.5.0" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download validated 0.5.9 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact
          gh run download 36270056789 \
            --repo "$GITHUB_REPOSITORY" \
            --name LoyalCrowns-Ender-Legacy-1.20.1-0.5.9-dev-source \
            --dir /tmp/source-artifact
          SOURCE_ZIP="$(find /tmp/source-artifact -type f -name '*0.5.9-dev-source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP"
          PROJECT_DIR="$(find . -maxdepth 2 -type f -name gradle.properties -path '*0.5.9-worktree*' -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          grep -q '^mod_version=0.5.9-alpha$' "$PROJECT_DIR/gradle.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply 0.6.0 modernization patch
        shell: bash
        run: |
          python patches/0.6.0/apply_modernization_patch.py "$PROJECT_DIR"
          grep -q '^mod_version=0.6.0-alpha$' "$PROJECT_DIR/gradle.properties"
          grep -q 'MachineRedstoneMode' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/LegacyPoweredBlockEntity.java"
          grep -q 'MachineIOMode' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
          grep -q 'REDSTONE_BUTTON_ID' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/FarmingStationMenu.java"
          grep -q 'Side Configuration' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/FarmingStationScreen.java"
          grep -q 'isMachineEnabledByRedstone' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
          test -f "$PROJECT_DIR/src/main/resources/assets/loyacrowns_ender_legacy/textures/block/farming_station_side_modern.png"
          test -f "$PROJECT_DIR/src/main/resources/assets/loyacrowns_ender_legacy/textures/block/soul_machine_top_modern.png"
          test -f "$PROJECT_DIR/src/main/resources/assets/loyacrowns_ender_legacy/textures/block/soul_machine_bottom_modern.png"

      - name: Prepare Forge build
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])/'build.gradle'
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line)+'\n')
          PY

      - name: Validate resources
        shell: bash
        run: |
          python "$PROJECT_DIR/tools/validate_assets.py"
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])/'src/main/resources'
          n=0
          for p in root.rglob('*'):
              if p.suffix in {'.json','.mcmeta'}:
                  json.loads(p.read_text()); n+=1
          print(f'Validated {n} JSON/mcmeta resources.')
          PY

      - name: Build and reobfuscate
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Validate 0.6.0 JAR
        shell: bash
        run: |
          JAR="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name 'LoyalCrowns-Ender-Legacy-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/util/MachineRedstoneMode.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/util/MachineIOMode.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/blockentity/LegacyPoweredBlockEntity.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/client/FarmingStationScreen.class' /tmp/jar-contents.txt
          grep -q 'assets/loyacrowns_ender_legacy/textures/block/farming_station_side_modern.png' /tmp/jar-contents.txt
          grep -q 'assets/loyacrowns_ender_legacy/models/block/farming_station_legacy.json' /tmp/jar-contents.txt
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="0.6.0-alpha"'
          echo '0.6.0 modern Farming Station + shared redstone/IO machine foundation validated.'

      - uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-alpha
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
