name: Build 0.5.8 Inventory Panel Return Storage

on:
  workflow_dispatch:
  push:
    branches: [ "dev/final-parity-0.5.0" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download validated 0.5.7 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact
          gh run download 36264531028 \
            --repo "$GITHUB_REPOSITORY" \
            --name LoyalCrowns-Ender-Legacy-1.20.1-0.5.7-dev-source \
            --dir /tmp/source-artifact
          SOURCE_ZIP="$(find /tmp/source-artifact -type f -name '*0.5.7-dev-source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP"
          PROJECT_DIR="$(find . -maxdepth 2 -type f -name gradle.properties -path '*0.5.7-worktree*' -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          grep -q '^mod_version=0.5.7-alpha$' "$PROJECT_DIR/gradle.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply 0.5.8 Return / Storage Area parity pass
        shell: bash
        run: |
          cat patches/0.5.8/inventory_return_storage.b64.part1 \
              patches/0.5.8/inventory_return_storage.b64.part2 \
              patches/0.5.8/inventory_return_storage.b64.part3 \
              patches/0.5.8/inventory_return_storage.b64.part4 \
              > /tmp/inventory_return_storage.b64
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          encoded = Path('/tmp/inventory_return_storage.b64').read_text().replace('\n','').strip()
          decoded = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(decoded).hexdigest() == '40155f487c635f7f70dd9120dae8f1b723b3ad75f2cf6d3eebfb7e9006a357d0'
          Path('/tmp/inventory_return_storage.patch').write_bytes(decoded)
          PY
          patch -d "$PROJECT_DIR" -p1 < /tmp/inventory_return_storage.patch
          grep -q '^mod_version=0.5.8-alpha$' "$PROJECT_DIR/gradle.properties"
          grep -q 'RETURN_STORAGE_SLOTS = 15' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/InventoryPanelBlockEntity.java"
          grep -q 'ExtractionDisabled' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/InventoryPanelBlockEntity.java"
          grep -q 'isLocalStorageMode' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/InventoryPanelMenu.java"
          grep -q 'case 42' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/InventoryPanelMenu.java"
          grep -q 'Storage Area' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/InventoryPanelScreen.java"

      - name: Prepare Forge build
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])/'build.gradle'
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line)+'\n')
          PY

      - name: Validate resources
        shell: bash
        run: |
          python "$PROJECT_DIR/tools/validate_assets.py"
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])/'src/main/resources'
          n=0
          for p in root.rglob('*'):
              if p.suffix in {'.json','.mcmeta'}:
                  json.loads(p.read_text()); n+=1
          print(f'Validated {n} JSON/mcmeta resources.')
          PY

      - name: Build and reobfuscate
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Validate 0.5.8 JAR
        shell: bash
        run: |
          JAR="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name 'LoyalCrowns-Ender-Legacy-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/blockentity/InventoryPanelBlockEntity.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/menu/InventoryPanelMenu.class' /tmp/jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/client/InventoryPanelScreen.class' /tmp/jar-contents.txt
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="0.5.8-alpha"'
          echo '0.5.8 Inventory Panel Return/Storage Area parity validated.'

      - uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.5.8-alpha
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
