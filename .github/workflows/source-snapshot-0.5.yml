name: Prepare 0.5.x Source Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ "dev/final-parity-0.5.0" ]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract base source snapshot
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f \( -name 'LoyalCrowns-Ender-Legacy-1.20.1-*-source*.zip' -o -name 'LoyaCrowns-Ender-Legacy-1.20.1-*-source*.zip' \) -print | sort -V | tail -1)"
          test -n "$ZIP"
          unzip -q "$ZIP"
          PROJECT_DIR="$(find . -maxdepth 2 -type f -name gradle.properties -path '*Ender-Legacy*' -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply 0.1.1 Farming Station baseline
        shell: bash
        run: |
          if grep -q '^mod_version=0.1.0-alpha$' "$PROJECT_DIR/gradle.properties"; then
            cp patches/0.1.1/FarmingStationBlockEntity.java "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
            sed -i 's/mod_version=0.1.0-alpha/mod_version=0.1.1-alpha/' "$PROJECT_DIR/gradle.properties"
            python patches/0.1.1/fix_output.py
          fi

      - name: Download Ender IO 5.3.72 reference
        shell: bash
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://www.curseforge.com/api/v1/mods/64578/files/4674244/download' \
            -o EnderIO-1.12.2-5.3.72.jar
          jar tf EnderIO-1.12.2-5.3.72.jar >/dev/null

      - name: Apply 0.2.0 parity patches
        shell: bash
        run: |
          cat patches/0.2.0/visuals.part* > /tmp/upgrade_visuals.py
          cat patches/0.2.0/content.part* > /tmp/upgrade_content.py
          python /tmp/upgrade_visuals.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar"
          python /tmp/upgrade_content.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar"

      - name: Apply 0.3.0 full core pass
        shell: bash
        run: |
          cat patches/0.3.0/full_core.part* > /tmp/full_core.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('/tmp/full_core.b64').read_text().strip()
          Path('/tmp/full_core_port.py').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/full_core_port.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar"

      - name: Apply 0.4.0 deep parity pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('patches/0.4.0/deep_parity.py.zlib.b64').read_text().strip()
          Path('/tmp/deep_parity.py').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/deep_parity.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar"
          python patches/0.4.0/fix_simple_crafter.py "$PROJECT_DIR"
          grep -q '^mod_version=0.4.0-alpha$' "$PROJECT_DIR/gradle.properties"

      - name: Apply 0.5.0 Farming Station GUI pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('patches/0.5.0/farming_gui.patch.zlib.b64').read_text().strip()
          Path('/tmp/farming_gui.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          patch -d "$PROJECT_DIR" -p2 < /tmp/farming_gui.patch
          python patches/0.5.0/fix_client_menu_registration.py "$PROJECT_DIR"
          python - "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar" <<'PY'
          from pathlib import Path
          import sys, zipfile
          root=Path(sys.argv[1])
          jar=sys.argv[2]
          source='assets/enderio/textures/gui/40/farm_station.png'
          target=root/'src/main/resources/assets/loyacrowns_ender_legacy/textures/gui/farm_station.png'
          target.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(jar) as z:
              target.write_bytes(z.read(source))
          PY

      - name: Apply 0.5.1 Farming Station behavior pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('patches/0.5.1/farming_deep_parity.patch.zlib.b64').read_text().strip()
          Path('/tmp/farming_deep_parity.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          patch -d "$PROJECT_DIR" -p2 < /tmp/farming_deep_parity.patch

      - name: Apply 0.5.2 Dimensional Transceiver parity pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = Path('patches/0.5.2/transceiver_parity.patch.zlib.b64').read_text().strip()
          Path('/tmp/transceiver_parity.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          patch -d "$PROJECT_DIR" -p2 < /tmp/transceiver_parity.patch
          python - "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar" <<'PY'
          from pathlib import Path
          import sys, zipfile
          root=Path(sys.argv[1])
          jar=sys.argv[2]
          targets = {
              'assets/enderio/textures/gui/40/transceiver_general.png': 'transceiver_general.png',
              'assets/enderio/textures/gui/40/transceiver_channel_select.png': 'transceiver_channel_select.png',
          }
          out = root/'src/main/resources/assets/loyacrowns_ender_legacy/textures/gui'
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(jar) as z:
              for source, name in targets.items():
                  (out/name).write_bytes(z.read(source))
          PY
          grep -q '^mod_version=0.5.2-alpha$' "$PROJECT_DIR/gradle.properties"

      - name: Package reconstructed source
        shell: bash
        run: |
          cp -R "$PROJECT_DIR" LoyalCrowns-Ender-Legacy-0.5.2-worktree
          rm -rf LoyalCrowns-Ender-Legacy-0.5.2-worktree/build LoyalCrowns-Ender-Legacy-0.5.2-worktree/.gradle
          zip -qr LoyalCrowns-Ender-Legacy-1.20.1-0.5.2-dev-source.zip LoyalCrowns-Ender-Legacy-0.5.2-worktree

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.5.2-dev-source
          path: LoyalCrowns-Ender-Legacy-1.20.1-0.5.2-dev-source.zip
          if-no-files-found: error
