name: Prepare 0.6.0 Source Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ "dev/final-parity-0.5.0" ]

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Download validated 0.5.9 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact
          gh run download 36270056789 \
            --repo "$GITHUB_REPOSITORY" \
            --name LoyalCrowns-Ender-Legacy-1.20.1-0.5.9-dev-source \
            --dir /tmp/source-artifact
          SOURCE_ZIP="$(find /tmp/source-artifact -type f -name '*0.5.9-dev-source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP"
          PROJECT_DIR="$(find . -maxdepth 2 -type f -name gradle.properties -path '*0.5.9-worktree*' -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          grep -q '^mod_version=0.5.9-alpha$' "$PROJECT_DIR/gradle.properties"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply 0.6.0 modernization patch
        shell: bash
        run: |
          python patches/0.6.0/apply_modernization_patch.py "$PROJECT_DIR"
          grep -q '^mod_version=0.6.0-alpha$' "$PROJECT_DIR/gradle.properties"
          grep -q 'MachineRedstoneMode' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/LegacyPoweredBlockEntity.java"
          grep -q 'MachineIOMode' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
          grep -q 'Side Configuration' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/client/FarmingStationScreen.java"
          grep -q 'REDSTONE_BUTTON_ID' "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/menu/FarmingStationMenu.java"
          python "$PROJECT_DIR/tools/validate_assets.py"

      - name: Prepare Forge build
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])/'build.gradle'
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line)+'\n')
          PY

      - name: Build reconstructed 0.6.0 mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'LoyalCrowns-Ender-Legacy-*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$JAR_PATH"
          cp "$JAR_PATH" "$GITHUB_WORKSPACE/LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-alpha.jar"

      - name: Package reconstructed source
        shell: bash
        run: |
          cp -R "$PROJECT_DIR" LoyalCrowns-Ender-Legacy-0.6.0-worktree
          rm -rf LoyalCrowns-Ender-Legacy-0.6.0-worktree/build LoyalCrowns-Ender-Legacy-0.6.0-worktree/.gradle
          zip -qr LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-dev-source.zip LoyalCrowns-Ender-Legacy-0.6.0-worktree

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-dev-source
          path: LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-dev-source.zip
          if-no-files-found: error

      - name: Upload playable 0.6.0 jar
        uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-alpha
          path: LoyalCrowns-Ender-Legacy-1.20.1-0.6.0-alpha.jar
          if-no-files-found: error
