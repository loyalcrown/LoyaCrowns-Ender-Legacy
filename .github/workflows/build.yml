name: Build LoyalCrown's Ender Legacy

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev/1.12-parity" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract base source snapshot
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f \( -name 'LoyalCrowns-Ender-Legacy-1.20.1-*-source*.zip' -o -name 'LoyaCrowns-Ender-Legacy-1.20.1-*-source*.zip' \) -print | sort -V | tail -1)"
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          echo "Using $ZIP"
          unzip -q "$ZIP"
          PROJECT_DIR="$(find . -maxdepth 2 -type f -name gradle.properties -path '*Ender-Legacy*' -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Extracted project directory not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Apply 0.1.1 Farming Station baseline
        shell: bash
        run: |
          if grep -q '^mod_version=0.1.0-alpha$' "$PROJECT_DIR/gradle.properties"; then
            cp patches/0.1.1/FarmingStationBlockEntity.java "$PROJECT_DIR/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java"
            sed -i 's/mod_version=0.1.0-alpha/mod_version=0.1.1-alpha/' "$PROJECT_DIR/gradle.properties"
            python patches/0.1.1/fix_output.py
            echo 'Applied Farming Station 0.1.1 baseline.'
          fi

      - name: Download Ender IO 5.3.72 reference
        shell: bash
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://www.curseforge.com/api/v1/mods/64578/files/4674244/download' \
            -o EnderIO-1.12.2-5.3.72.jar
          jar tf EnderIO-1.12.2-5.3.72.jar >/dev/null
          echo 'Validated EnderIO-1.12.2-5.3.72.jar reference download.'

      - name: Apply 1.12.2 parity patches
        shell: bash
        run: |
          cat patches/0.2.0/visuals.part* > /tmp/upgrade_visuals.py
          cat patches/0.2.0/content.part* > /tmp/upgrade_content.py
          python /tmp/upgrade_visuals.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar"
          python /tmp/upgrade_content.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/EnderIO-1.12.2-5.3.72.jar"

      - name: Prepare Forge build
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]) / 'build.gradle'
          lines = p.read_text().splitlines()
          lines = [line for line in lines if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line]
          p.write_text('\n'.join(lines) + '\n')
          print('Ender IO remains a required runtime dependency in mods.toml; source compiles against Forge APIs.')
          PY

      - name: Validate assets and registered block resources
        shell: bash
        run: python "$PROJECT_DIR/tools/validate_assets.py"

      - name: Validate JSON resources
        shell: bash
        run: |
          python - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1]) / 'src/main/resources'
          checked = 0
          for p in root.rglob('*'):
              if p.suffix in {'.json', '.mcmeta'}:
                  json.loads(p.read_text())
                  checked += 1
          print(f'Validated {checked} JSON/mcmeta resource files.')
          PY

      - name: Build and reobfuscate
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace

      - name: Validate 0.2.0 release JAR
        shell: bash
        run: |
          JAR="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name 'LoyalCrowns-Ender-Legacy-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          echo "Validating $JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -q 'META-INF/mods.toml' jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/LoyaCrownsEnderLegacy.class' jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/block/LegacyExitRailBlock.class' jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/blockentity/ZombieGeneratorBlockEntity.class' jar-contents.txt
          for block in farming_station dark_steel_anvil ender_rail exit_rail advanced_power_monitor dark_paper_anvil franken_zombie_generator ender_generator dimensional_transceiver; do
            grep -q "assets/loyacrowns_ender_legacy/models/block/${block}.json" jar-contents.txt
            grep -q "assets/loyacrowns_ender_legacy/blockstates/${block}.json" jar-contents.txt
            grep -q "assets/loyacrowns_ender_legacy/models/item/${block}.json" jar-contents.txt
          done
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId="enderio"'
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'versionRange="\[6.2.15-beta,6.3)"'
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="0.2.0-alpha"'
          unzip -p "$JAR" META-INF/mods.toml | grep -q "displayName=\"LoyalCrown's Ender Legacy\""
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'authors="LoyalCrown"'
          echo '0.2.0-alpha JAR structure, assets, branding, and Ender IO dependency metadata validated.'

      - uses: actions/upload-artifact@v4
        with:
          name: LoyalCrowns-Ender-Legacy-1.20.1-0.2.0-alpha
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
