name: Build LoyaCrown's Ender Legacy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract source snapshot
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'LoyaCrowns-Ender-Legacy-1.20.1-0.1.0-alpha-source*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          echo "Using $ZIP"
          unzip -q "$ZIP"
      - name: Prepare build and Ender IO runtime
        working-directory: LoyaCrowns-Ender-Legacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          lines = s.splitlines()
          lines = [line for line in lines if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line]
          s = '\n'.join(lines) + '\n'
          s = s.replace("repositories {\n    maven { url = 'https://maven.rover656.dev/releases' }\n}", "repositories {\n    maven { url = 'https://maven.rover656.dev/releases' }\n    maven { url = 'https://cursemaven.com' }\n}")
          s = s.replace('dependencies {\n    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"', 'dependencies {\n    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"\n    runtimeOnly fg.deobf("curse.maven:ender-io-64578:7004092")')
          p.write_text(s)
          print('Configured Ender IO 6.2.15-beta from CurseMaven for runtime testing.')
          PY
      - name: Build
        working-directory: LoyaCrowns-Ender-Legacy
        run: gradle --no-daemon clean build --stacktrace
      - name: Smoke test with Ender IO 6.2.15-beta
        working-directory: LoyaCrowns-Ender-Legacy
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 120s gradle --no-daemon runServer > server-smoke.log 2>&1
          CODE=$?
          set -e
          tail -n 160 server-smoke.log || true
          if grep -q "Done (" run/logs/latest.log 2>/dev/null; then
            echo "Forge server reached Done state with Ender IO 6.2.15-beta and LoyaCrown's Ender Legacy loaded."
            exit 0
          fi
          echo "Server did not reach Done state (timeout/exit code $CODE)."
          if [ -f run/logs/latest.log ]; then
            tail -n 220 run/logs/latest.log
          fi
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoyaCrowns-Ender-Legacy-1.20.1
          path: LoyaCrowns-Ender-Legacy/build/libs/*.jar
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-smoke-logs
          path: |
            LoyaCrowns-Ender-Legacy/server-smoke.log
            LoyaCrowns-Ender-Legacy/run/logs/latest.log
          if-no-files-found: ignore
