name: Build LoyaCrown's Ender Legacy

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev/farming-station-0.1.1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source snapshot
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'LoyaCrowns-Ender-Legacy-1.20.1-*-source*.zip' -print | sort -V | tail -1)"
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          echo "Using $ZIP"
          unzip -q "$ZIP"

      - name: Apply development patches
        shell: bash
        run: |
          if [ -f patches/0.1.1/FarmingStationBlockEntity.java ]; then
            cp patches/0.1.1/FarmingStationBlockEntity.java LoyaCrowns-Ender-Legacy/src/main/java/com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.java
            sed -i 's/mod_version=0.1.0-alpha/mod_version=0.1.1-alpha/' LoyaCrowns-Ender-Legacy/gradle.properties
            echo 'Applied Farming Station 0.1.1 patch.'
          fi

      - name: Prepare source snapshot
        working-directory: LoyaCrowns-Ender-Legacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if 'com.enderio:enderio:' not in line and 'com.enderio:EnderIO:' not in line]
          p.write_text('\n'.join(lines) + '\n')
          print('Ender IO is enforced by mods.toml at runtime; the addon compiles against Forge APIs only.')
          PY

      - name: Validate resource JSON
        working-directory: LoyaCrowns-Ender-Legacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          checked = 0
          for p in Path('src/main/resources').rglob('*'):
              if p.suffix in {'.json', '.mcmeta'}:
                  json.loads(p.read_text())
                  checked += 1
          print(f'Validated {checked} JSON/mcmeta resource files.')
          PY

      - name: Build and reobfuscate
        working-directory: LoyaCrowns-Ender-Legacy
        run: gradle --no-daemon clean build --stacktrace

      - name: Validate release JAR
        working-directory: LoyaCrowns-Ender-Legacy
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'LoyaCrowns-Ender-Legacy-*.jar' ! -name '*sources*' -print -quit)"
          test -n "$JAR"
          echo "Validating $JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -q 'META-INF/mods.toml' jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/LoyaCrownsEnderLegacy.class' jar-contents.txt
          grep -q 'com/loyacrown/enderlegacy/blockentity/FarmingStationBlockEntity.class' jar-contents.txt
          for block in farming_station reservoir combustion_generator zombie_generator photovoltaic_cell advanced_photovoltaic_cell hyper_cube dimensional_transceiver power_monitor the_vat wireless_charger killer_joe attractor_obelisk item_buffer power_buffer omni_buffer creative_buffer dark_steel_anvil painted_carpet ender_rail ender_io; do
            grep -q "assets/loyacrowns_ender_legacy/models/block/${block}.json" jar-contents.txt
          done
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId="enderio"'
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'versionRange="\[6.2.15-beta,6.3)"'
          if [ -f ../patches/0.1.1/FarmingStationBlockEntity.java ]; then
            unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="0.1.1-alpha"'
          fi
          echo 'Release JAR structure and Ender IO dependency metadata validated.'

      - uses: actions/upload-artifact@v4
        with:
          name: LoyaCrowns-Ender-Legacy-1.20.1
          path: LoyaCrowns-Ender-Legacy/build/libs/*.jar
          if-no-files-found: error
