name: Build LoyaCrown's Ender Legacy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract source snapshot
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'LoyaCrowns-Ender-Legacy-1.20.1-0.1.0-alpha-source*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          echo "Using $ZIP"
          unzip -q "$ZIP"
      - name: Fix Ender IO dependency coordinates
        working-directory: LoyaCrowns-Ender-Legacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          s = s.replace('com.enderio:enderio:${enderio_version}:api', 'com.enderio:EnderIO:${minecraft_version}-${enderio_version}:api')
          s = s.replace('com.enderio:enderio:${enderio_version}', 'com.enderio:EnderIO:${minecraft_version}-${enderio_version}')
          p.write_text(s)
          print('Patched Ender IO coordinates in build.gradle')
          PY
      - name: Build
        working-directory: LoyaCrowns-Ender-Legacy
        run: gradle --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LoyaCrowns-Ender-Legacy-1.20.1
          path: LoyaCrowns-Ender-Legacy/build/libs/*.jar
          if-no-files-found: warn
